<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Project: To-do List</title>
</head>
<body>
    <header>
        <img src="images/logo.png" class="logo" 
        title="Get it, get the rhythm, get the rhythm, there you go, there you fucking go.">
        <div class="header-title"></div>
    </header>

    <div class="main">
        <div class="dashboard">
            <div class="filters">
                <div class="today">Today</div>
                <div class="urgent">Urgent</div>
            </div>
            <div class="projects">
                <div class="project-card">
                    <div class="project-title">Home</div>
                </div>
            </div>

            <div class="new-project-row">
                <input type="text" id="input-new-project" placeholder="New project">
                <button type="button" class="button-new-project">+</button>
            </div>
        </div>
        <div class="content">
            <div class="items">
                <div class="item-card">
                    <div class="item-header">
                        <div class="checkbox">X</div>
                        <div class="item-title">Pick up son</div>
                        <div class="options">...</div>
                    </div>
                    <div class="item-subheader">
                        <div class="item-date">06/11</div>
                        <div class="item-priority">High</div>
                    </div>
                    <div class="item-notes">Notes: I don't have a son?</div>
                </div>
            </div>
            <div class="new-item-row">
                <button type="button" class="button-new-item">+</button>
                <div class="new-item-label">New</div>
            </div>
        </div>
    </div>
</body>
</html>
