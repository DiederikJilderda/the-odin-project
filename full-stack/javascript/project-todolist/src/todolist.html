<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Project: To-do List</title>
</head>
<body>
    <header>
        <div class="header-icon">icon</div>
        <div class="header-title">Title</div>
    </header>

    <div class="main">
        <div class="dashboard">
            <div class="filters">
                <div class="today">Today</div>
                <div class="urgent">Urgent</div>
            </div>
            <div class="projects">
                <div class="project-card">
                    <div class="project-title">Home</div>
                </div>
            </div>

            <div class="new-project-row">
                <input type="text" id="input-new-project" placeholder="New project">
                <button type="button" class="button-new-project">+</button>
            </div>
        </div>
        <div class="content">
            <div class="items"></div>
            <div class="new-item-row">
                <button type="button" class="button-new-item">+</button>
                <div class="new-item-label">New</div>
            </div>
        </div>
    </div>
</body>
</html>
