<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Project: To-Do List</title>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <img src="images/logo.png">
        </div>

        <div class="dashboard">

            <div class="dashboard-highlights">
                <div class="row">
                    <img src="images/today.png" class="icon">
                    <div class="dashboard-header">Highlights</div>
                </div>
            </div>

            <div class="dashboard-projects">
                <div class="row">
                    <img src="images/projects.png" class="icon">
                    <div class="dashboard-header">Projects</div>
                </div>
            </div>

        </div>

        <div class="new-project-row">
            <input type="text" id="input-new-project" placeholder="New project">
            <button type="button" class="button-new-project">+</button>
        </div>
    </div>

    <div class="main">
        <div class="main-title">Home</div>

        <div class="tasks">
            <div class="task-card">
                <div class="task-header">
                    <input type="checkbox">
                    <div class="task-title">Pick up son</div>
                    <button type="button" class="button-delete-task"><img src="images/delete.png"></button>                   
                </div>
                <div class="task-content">
                    <div>
                        <div class="task-unit">
                            <div class="task-subheader">Project: </div>
                            <input id="task-project" type="text" value="Home" readonly></input>
                        </div>
                        <div class="task-unit">
                            <div class="task-subheader">Due date: </div>
                            <input id="task-date" type="date" value="2026-11-19" readonly></input>
                        </div>
                        <div class="task-unit">
                            <div class="task-subheader">Priority: </div>
                            <!-- <input id="task-priority" type="text" value="High" readonly></input> -->
                            <select id="task-priority" type="options">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high" selected>High</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="task-subheader">Notes: </div>
                        <input id="task-notes" type="textarea" value="I have a son?" readonly></input>
                    </div>
                </div>
            </div>

            <div class="task-card urgent">
                <div class="task-header">
                    <input type="checkbox">
                    <div class="task-title">Pick up son</div>
                    <button type="button" class="button-delete-task"><img src="images/delete.png"></button>                   
                </div>
                <div class="task-content">
                    <div>
                        <div class="task-unit">
                            <div class="task-subheader">Project: </div>
                            <input id="task-project" type="text" value="Home" readonly></input>
                        </div>
                        <div class="task-unit">
                            <div class="task-subheader">Due date: </div>
                            <input id="task-date" type="date" value="2026-11-19" readonly></input>
                        </div>
                        <div class="task-unit">
                            <div class="task-subheader">Priority: </div>
                            <!-- <input id="task-priority" type="text" value="High" readonly></input> -->
                            <select id="task-priority" type="options">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high" selected>High</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="task-subheader">Notes: </div>
                        <input id="task-notes" type="textarea" value="I have a son?" readonly></input>
                    </div>
                </div>
            </div>

            <div class="task-card completed">
                <div class="task-header">
                    <input type="checkbox">
                    <div class="task-title">Pick up son</div>
                    <button type="button" class="button-delete-task"><img src="images/delete.png"></button>                   
                </div>
                <div class="task-content">
                    <div>
                        <div class="task-unit">
                            <div class="task-subheader">Project: </div>
                            <input id="task-project" type="text" value="Home" readonly></input>
                        </div>
                        <div class="task-unit">
                            <div class="task-subheader">Due date: </div>
                            <input id="task-date" type="date" value="2026-11-19" readonly></input>
                        </div>
                        <div class="task-unit">
                            <div class="task-subheader">Priority: </div>
                            <!-- <input id="task-priority" type="text" value="High" readonly></input> -->
                            <select id="task-priority" type="options">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high" selected>High</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="task-subheader">Notes: </div>
                        <input id="task-notes" type="textarea" value="I have a son?" readonly></input>
                    </div>
                </div>
            </div>
        </div>

        <div class="new-task-row">
            <button type="button" class="button-new-task">+</button>
        </div>
    </div>
</body>
</html>
