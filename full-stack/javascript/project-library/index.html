<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <form> 
        <div class="form-field">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="some-book">
        </div>
        <div class="form-field">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" value="some-author">
        </div>
        <div class="form-field">
            <label for="pages">Pages</label>
            <input type="number" id="pages" name="pages" value="1010">
        </div>
        <div class="form-field">
            <label for="year">Year</label>
            <input type="tel" id="year" name="year" maxlength="4" value="1982">
        </div>
        <div class="form-field">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="Read">Read</option>
                <option value="Unread" selected>Unread</option>
            </select>
        </div>
        <div class="form-field">
            <label for="cover">Cover image</label>
            <input type="file" id="cover" name="cover">
        </div>
        <button type="button" class="button-submit">Add entry</button>
    </form>

    <div class="main">
    </div>
</body>

</html>
