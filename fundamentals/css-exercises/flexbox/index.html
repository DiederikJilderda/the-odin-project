<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container green">
        <!-- Row 1 -->
        <div class="row1 blue">
            <div class="item-row1 orange"></div>
            <div class="item-row1 orange">
                <div class="item-row1-middle red"></div>
                <div class="item-row1-middle red"></div>
            </div>
            <div class="item-row1 orange"></div>
        </div>

        <!-- Row 2 -->
        <div class="row2">
            <div class="item-row2 red"></div>
            <div class="item-row2-right">
                <div class="item-row2 red"></div>
                <div class="item-row2 red"></div>
            </div>
        </div>
        
        <!-- Row 3 -->
        <div class="row1 blue">
            <div class="item-row3-1 purple"></div>
            <div class="item-row3-2 orange"></div>
            <div class="item-row3-2 orange"></div>
            <div class="item-row3-1 purple"></div>
        </div>
</body>
</html>
